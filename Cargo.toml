[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Golden-fixturen for DiffTooBig kjører Myers til terskelen, det tar over 30 s uoptimert
[profile.test]
opt-level = 1
