[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Metal Toolchain is missing locally, so the shaders are compiled at startup
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

# The golden fixture for DiffTooBig runs Myers up to the threshold, which takes over 30 s unoptimized
[profile.test]
opt-level = 1
