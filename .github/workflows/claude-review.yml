name: Claude review

# Runs once per PR. New commits don't trigger a new review; close and reopen the PR for that.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths-ignore: [ "**.md", "docs/**" ]

# Don't cancel a review halfway, or it leaves half its comments behind
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The repo's own token instead of the Claude app, so the PR that changes this file can review itself
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "CODING_STANDARDS.md in the repo root has rules with the same weight as CLAUDE.md. Include it in the CLAUDE.md compliance check."
