name: Rust

# Changes to documentation alone don't run CI
on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "docs/**" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "docs/**" ]

# A new push to a PR cancels its run in progress. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info: less to compile and link, and CI doesn't need it
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
    # Only main saves the cache. PRs can read main's cache, but not each other's.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Run tests
      run: cargo test --verbose --locked
