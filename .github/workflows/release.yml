name: Release

# An annotated tag like v0.2.0 builds jetdiff.app for Apple Silicon and puts it in a GitHub
# release, together with scripts/install.sh, which fetches it from there. The tag's message is
# the release notes, with GitHub's list of merged PRs under it.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Apple Silicon
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    # checkout fetches the tag without its message
    - name: Fetch the tag
      run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
    - name: Read the release notes
      run: scripts/release/notes.sh "$GITHUB_REF_NAME" > notes.md
    - name: Check the version
      run: scripts/release/check-version.sh "${GITHUB_REF_NAME#v}"
    - name: Run tests
      run: cargo test --workspace --locked
    - name: Build
      run: cargo build --release --locked -p jetdiff
    - name: Package
      run: scripts/release/package.sh target/release/jetdiff "${GITHUB_REF_NAME#v}"
    # gh uploads the files before the release is published, so install.sh never finds a release without them
    - name: Release
      run: gh release create "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes jetdiff-aarch64-apple-darwin.tar.gz jetdiff-aarch64-apple-darwin.tar.gz.sha256 scripts/install.sh
      env:
        GH_TOKEN: ${{ github.token }}
