# Innstillinger for jetdiff.

# catppuccin-mocha, jetbrains-dark eller jetbrains-light.
theme = "catppuccin-mocha"

# Mellom 8 og 40. Cmd-0 går tilbake hit.
font_size = 14

# false viser hele fila, uten å klappe sammen uendrede deler.
collapse_unchanged = true

# split eller unified. v bytter mens appen kjører.
view = "split"

[side_panel]
# true viser filtreet og commitene ved oppstart. b viser og skjuler dem.
open = false

[terminal]
# Filikoner i terminalvisningen. Krever en Nerd Font, se README.
icons = true
