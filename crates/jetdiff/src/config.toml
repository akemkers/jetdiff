# Settings for jetdiff.

# catppuccin-mocha, jetbrains-dark or jetbrains-light.
theme = "catppuccin-mocha"

# Between 8 and 40. Cmd-0 goes back to this.
font_size = 14

# false shows the whole file, without folding unchanged parts.
fold_unchanged = true

# split or unified. v switches while the app is running.
diff_mode = "split"

[side_panel]
# true shows the file tree and the commit list at startup. b shows and hides them.
open = false

[terminal]
# File icons in the terminal view. Requires a Nerd Font, see the README.
icons = true
