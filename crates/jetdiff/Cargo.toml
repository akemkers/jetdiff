[package]
name = "jetdiff"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["gui", "tui"]
gui = ["dep:gpui", "dep:jetdiff-ui"]
tui = ["dep:jetdiff-tui"]

[dependencies]
gpui = { workspace = true, optional = true }
jetdiff-app = { path = "../jetdiff-app" }
jetdiff-changes = { path = "../jetdiff-changes" }
jetdiff-git = { path = "../jetdiff-git" }
jetdiff-ui = { path = "../jetdiff-ui", optional = true }
jetdiff-tui = { path = "../jetdiff-tui", optional = true }
jetdiff-viewmodel = { path = "../jetdiff-viewmodel" }
serde.workspace = true
toml = "1.1.6"
