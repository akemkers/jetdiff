# Deploy av kurs-api
name: kurs-api
replicas: 3
image:
  repository: ghcr.io/eksempel/kurs-api
  tag: "1.5.0"
env:
  - name: LOG_LEVEL
    value: debug
  - name: CACHE_TTL
    value: 60
  - name: FEATURE_FLAGS
    value: "sanntid,alarmer"
resources:
  limits:
    memory: 1Gi
    cpu: 500m
healthcheck: true
